[project]
name = "eval-platform"
version = "0.1.0"
description = "Versioned datasets, evaluation runs, judges and regression reports"
requires-python = ">=3.12"
dependencies = [
  "agent-common",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "structlog>=24.1,<26",
  "prometheus-client>=0.20,<1",
]

[tool.uv.sources]
agent-common = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]