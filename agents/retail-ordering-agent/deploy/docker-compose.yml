name: retail-ordering-agent

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agent_orders
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ../order-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagent", "-pagent"]
      interval: 5s
      timeout: 3s
      retries: 30

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    environment:
      ORDER_SERVICE_ADDR: ":8020"
      MYSQL_DSN: "agent:agent@tcp(mysql:3306)/agent_orders?parseTime=true&loc=UTC"
      SUPPLIER_BASE_URL: "http://host.docker.internal:9000"
      SUPPLIER_TOKEN: "supplier-token"
      ORDER_INTERNAL_TOKEN: "internal-token"
    ports: ["8020:8020"]
    depends_on: {mysql: {condition: service_healthy}}

  retail-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      ORDER_SERVICE_URL: http://order-service:8020
      DATA_PLATFORM_URL: http://data-platform:8001
    ports: ["8012:8012"]
    depends_on: [order-service]

volumes:
  mysql_data:
