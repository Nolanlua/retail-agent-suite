[project]
name = "agent-common"
version = "0.1.0"
description = "Shared configuration, auth, logging and telemetry for agent services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT>=2.9,<3",
  "httpx>=0.27,<1",
  "structlog>=24.1,<26",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp>=1.27,<2",
  "prometheus-client>=0.20,<1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_common"]
