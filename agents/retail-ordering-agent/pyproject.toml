[project]
name = "retail-ordering-agent"
version = "1.0.0"
description = "Enterprise retail replenishment agent for snack and daily-goods stores"
requires-python = ">=3.12"
dependencies = [
  "agent-common",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<2",
  "prometheus-client>=0.20,<1",
  "structlog>=24.1,<26",
]

[tool.uv.workspace]
members = ["packages/common"]

[tool.uv.sources]
agent-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
